server {
    listen 8443 ssl;
    http2 on;
    server_name edi.scadasystem.io;
    server_tokens off;
    ssl_certificate /etc/nginx/alpaca/edi.crt;
    ssl_certificate_key /etc/nginx/alpaca/edi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    resolver 127.0.0.11 valid=30s;
    location / {
        set $edi_upstream scada-edi:3016;
        proxy_pass http://$edi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host edi.scadasystem.io;
        proxy_set_header X-Forwarded-Host edi.scadasystem.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header X-Middleware-Subrequest "";
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
