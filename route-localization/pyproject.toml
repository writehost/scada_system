[project]
name = "route-localization"
version = "1.0.0"
description = "SCADA System Route: позиционирование погрузчика по AprilTag (Hikrobot MVS / OpenCV)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-contrib-python>=4.8"]

[project.optional-dependencies]
pupil = ["pupil-apriltags>=1.0.4"]
test = ["pytest>=7"]

[project.scripts]
route-localization = "route_localization.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
